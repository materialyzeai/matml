name: Docker - matgl - latest - Kokkos CPU

on:
  push:
    branches: [ main ]
    paths:
      - docker/Dockerfile.matgl.kokkos-cpu
      - .github/workflows/dockerhub-matgl.kokkos-cpu-latest.yml
  pull_request:
    branches: [ main ]
    paths:
      - docker/Dockerfile.matgl.kokkos-cpu
      - .github/workflows/dockerhub-matgl.kokkos-cpu-latest.yml
  workflow_dispatch:

env:
  IMAGE: materialyzeai/matgl:latest-kokkos-cpu

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: docker/Dockerfile.matgl.kokkos-cpu
          build-args: BUILD_JOBS=4
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm "$IMAGE" bash -c '
            set -euo pipefail
            lmp -h | tee /tmp/lmp_help.txt
            grep -qw "matgl"    /tmp/lmp_help.txt
            grep -qw "matgl/kk" /tmp/lmp_help.txt
            grep -q  "KOKKOS"   /tmp/lmp_help.txt
            python -c "import matgl, torch; print(\"matgl\", matgl.__version__, \"torch\", torch.__version__)"
            # In-process LAMMPS sharing the Python libtorch.
            python -c "
          import matgl
          from lammps import lammps
          lmp = lammps(cmdargs=[\"-log\", \"none\", \"-screen\", \"none\", \"-k\", \"on\", \"t\", \"1\", \"-sf\", \"kk\"])
          for style in (\"matgl\", \"matgl/kk\", \"snap\"):
              assert lmp.has_style(\"pair\", style), style
          print(lmp.version(), lmp.installed_packages)
          "
            mgl create-lammps-model --help > /dev/null
          '
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE"
