name: Docker - matgl - latest - Kokkos CPU

on:
  push:
    branches: [ main ]
    paths:
      - docker/Dockerfile.matgl.kokkos-cpu
      - .github/workflows/dockerhub-matgl.kokkos-cpu-latest.yml
      - .github/workflows/build-multiarch.yml
  pull_request:
    branches: [ main ]
    paths:
      - docker/Dockerfile.matgl.kokkos-cpu
      - .github/workflows/dockerhub-matgl.kokkos-cpu-latest.yml
      - .github/workflows/build-multiarch.yml
  workflow_dispatch:

jobs:
  docker:
    uses: ./.github/workflows/build-multiarch.yml
    secrets: inherit
    with:
      file: docker/Dockerfile.matgl.kokkos-cpu
      repository: materialyzeai/matgl
      tag: latest-kokkos-cpu
      build-args: BUILD_JOBS=4
      timeout-minutes: 120
      smoke-test: |
        set -euo pipefail
        lmp -h | tee /tmp/lmp_help.txt
        grep -qw "matgl"    /tmp/lmp_help.txt
        grep -qw "matgl/kk" /tmp/lmp_help.txt
        grep -q  "KOKKOS"   /tmp/lmp_help.txt
        python -c "import matgl, torch; print('matgl', matgl.__version__, 'torch', torch.__version__)"
        # In-process LAMMPS sharing the Python libtorch.
        python - <<'EOF'
        import matgl
        from lammps import lammps
        lmp = lammps(cmdargs=["-log", "none", "-screen", "none", "-k", "on", "t", "1", "-sf", "kk"])
        for style in ("matgl", "matgl/kk", "snap"):
            assert lmp.has_style("pair", style), style
        print(lmp.version(), lmp.installed_packages)
        EOF
        mgl create-lammps-model --help > /dev/null
