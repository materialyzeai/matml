name: Docker - matml - latest

on:
  # build-multiarch.yml changes reach main via the base image's workflow_run below.
  push:
    branches: [ main ]
    paths:
      - docker/Dockerfile.matml
      - .github/workflows/dockerhub-matml-latest.yml
  pull_request:
    branches: [ main ]
    paths:
      - docker/Dockerfile.matml
      - .github/workflows/dockerhub-matml-latest.yml
      - .github/workflows/build-multiarch.yml
  # Rebuild whenever the base image is republished.
  workflow_run:
    workflows: [ "Docker - matgl - latest - Kokkos CPU" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/build-multiarch.yml
    secrets: inherit
    with:
      file: docker/Dockerfile.matml
      repository: materialyzeai/matml
      tag: latest
      timeout-minutes: 60
      smoke-test: |
        set -euo pipefail
        lmp -h | tee /tmp/lmp_help.txt
        grep -qw "matgl"    /tmp/lmp_help.txt
        grep -qw "matgl/kk" /tmp/lmp_help.txt
        grep -q  "KOKKOS"   /tmp/lmp_help.txt
        python -c "import matgl, matcalc, matpes, torch; print('matgl', matgl.__version__, 'torch', torch.__version__)"
        python -c "from lammps import lammps; lammps(cmdargs=['-log', 'none', '-screen', 'none'])"
